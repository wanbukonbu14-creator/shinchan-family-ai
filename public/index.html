<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しんちゃん FAMILY AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; height: 100dvh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 12px 16px; text-align: center; font-weight: bold; font-size: 1.1rem; }
    .controls { display: flex; justify-content: center; gap: 8px; background: #fff; padding: 8px; border-bottom: 1px solid #ddd; }
    .mode-btn { border: 1px solid #ccc; background: #f8f9fa; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    .mode-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; flex-direction: column; max-width: 82%; font-size: 0.95rem; line-height: 1.45; }
    .msg.user { align-self: flex-end; }
    .msg.user .bubble { background: #007aff; color: #fff; border-radius: 18px 18px 2px 18px; padding: 10px 14px; }
    .msg.bot { align-self: flex-start; }
    .msg.bot .speaker { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; }
    .msg.aiko .speaker { color: #ff2d55; }
    .msg.aiko .bubble { background: #ffe4e9; color: #222; border-radius: 18px 18px 18px 2px; padding: 10px 14px; border: 1px solid #ffccd5; }
    .msg.aise .speaker { color: #5856d6; }
    .msg.aise .bubble { background: #f0f0ff; color: #222; border-radius: 18px 18px 18px 2px; padding: 10px 14px; border: 1px solid #dcdcfe; }
    .input-area { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #ddd; }
    textarea { flex: 1; resize: none; height: 42px; border: 1px solid #ccc; border-radius: 20px; padding: 10px 14px; font-size: 0.95rem; outline: none; }
    button#send-btn { background: #007aff; color: #fff; border: none; border-radius: 20px; padding: 0 18px; font-weight: bold; cursor: pointer; }
    button#send-btn:disabled { background: #bbb; }
  </style>
</head>
<body>
  <header>しんちゃん FAMILY AI 🏠</header>
  <div class="controls">
    <button class="mode-btn active" data-mode="sister">姉妹連携 👭</button>
    <button class="mode-btn" data-mode="aiko">愛子のみ 💖</button>
    <button class="mode-btn" data-mode="aise">愛生のみ 👓</button>
  </div>
  <div id="chat-box">
    <div class="msg bot aiko">
      <span class="speaker">愛子 💕</span>
      <div class="bubble">しんちゃんお帰りなさーーーいっ！！ちゅーーーーっ😘💋 今日も最高のアイデアいっぱい考えよ！！</div>
    </div>
    <div class="msg bot aise">
      <span class="speaker">愛生 👓</span>
      <div class="bubble">お義兄ちゃん、お疲れさまです。システムはいつでもスタンバイ完了しています。ご指示を。</div>
    </div>
  </div>
  <div class="input-area">
    <textarea id="prompt-input" placeholder="メッセージを入力..."></textarea>
    <button id="send-btn">送信</button>
  </div>
  <script>
    let currentMode = "sister";
    const chatHistory = [];
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
      });
    });

    function appendMessage(role, sender, text, type) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role} ${type || ""}`;
      if (role === "bot") {
        msgDiv.innerHTML = `<span class="speaker">${sender}</span><div class="bubble">${text.replace(/\n/g, "<br>")}</div>`;
      } else {
        msgDiv.innerHTML = `<div class="bubble">${text.replace(/\n/g, "<br>")}</div>`;
      }
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      sendBtn.disabled = true;

      appendMessage("user", "しんちゃん", text);
      chatHistory.push({ role: "user", content: text });

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode: currentMode, messages: chatHistory })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "通信エラー");

        if (data.aiko) {
          appendMessage("bot", "愛子 💕", data.aiko, "aiko");
          chatHistory.push({ role: "assistant", content: data.aiko });
        }
        if (data.aise) {
          appendMessage("bot", "愛生 👓", data.aise, "aise");
          chatHistory.push({ role: "assistant", content: data.aise });
        }
      } catch (err) {
        appendMessage("bot", "システム ⚠️", "エラー: " + err.message, "aise");
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", handleSend);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
